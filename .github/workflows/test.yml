name: Test Alpacon Websh Action

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-basic-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Basic Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          target: ${{ secrets.TEST_ALPACON_SERVER_NAME }}
          script: whoami

  # The CI token is bound to the "deploy" OS account, so username/groupname are
  # exercised with that account rather than root
  test-username-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Username Command
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          target: ${{ secrets.TEST_ALPACON_SERVER_NAME }}
          username: 'deploy'
          script: |
            whoami
            id

  test-username-with-group:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Username with Group
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          target: ${{ secrets.TEST_ALPACON_SERVER_NAME }}
          username: 'deploy'
          groupname: 'deploy'
          script: |
            whoami
            groups

  test-env-variable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Environment Variable
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          target: ${{ secrets.TEST_ALPACON_SERVER_NAME }}
          env: |
            MY_VAR=hello
          script: echo $MY_VAR

  test-multiline-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Alpacon CLI
        uses: alpacax/alpacon-setup-action@v1

      - name: Test Multi-line Script
        uses: ./
        with:
          workspace-url: ${{ secrets.TEST_ALPACON_WORKSPACE_URL }}
          api-token: ${{ secrets.TEST_ALPACON_API_TOKEN }}
          target: ${{ secrets.TEST_ALPACON_SERVER_NAME }}
          script: |
            whoami
            id
